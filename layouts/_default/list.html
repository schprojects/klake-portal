{{ define "main" }}
<section>
    <h1>{{ .Title }}</h1>
    <div class="content">
        {{ .Content }}
    </div>
    <ul class="page-list">
        {{ range .Pages }}
        <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ if .Date }}
            <time>{{ .Date.Format "January 2, 2006" }}</time>
            {{ end }}
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
